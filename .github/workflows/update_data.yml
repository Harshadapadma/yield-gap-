name: Update Market Data

on:
  schedule:
    - cron: '0 10 * * 1-5'   # Mon-Fri 10:00 UTC = 15:30 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas requests yfinance curl_cffi beautifulsoup4 lxml

      - name: Update bond yield + Nifty PE + Nifty close
        run: python scripts/update_live_data.py

      - name: Update all index prices
        run: python scripts/cache_all_indices.py

      - name: Update breadth stock prices (Nifty 500)
        run: python scripts/cache_breadth_prices.py

      - name: Compute breadth series and save result CSV
        run: python scripts/compute_breadth.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/live/ cache/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
          git push
