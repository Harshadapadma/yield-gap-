name: Update Market Data

on:
  schedule:
    - cron: '0 11 * * 1-5'   # Mon-Fri 11:00 UTC = 16:30 IST (30 min after market close)
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pandas requests yfinance curl_cffi beautifulsoup4 lxml

      - name: Update bond yield + Nifty PE + Nifty close
        run: python scripts/update_live_data.py

      - name: Update all index prices
        run: python scripts/cache_all_indices.py

      - name: Update breadth stock prices (Nifty 500)
        run: python scripts/cache_breadth_prices.py

      - name: Compute breadth series and save result CSV
        run: python scripts/compute_breadth.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/ cache/
          git diff --staged --quiet || git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

